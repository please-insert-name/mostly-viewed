<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mostly Wise – Chat-Viewer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%233f5aa6' d='M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="appbar">
    <button class="icon-btn" id="btn-lib" title="Bibliothek ein-/ausblenden"></button>
    <h1 id="title">Mostly Wise</h1>
    <span class="status" id="status">bereit</span>
    <button class="chip" id="chip-tech" title="Alle Tool-Calls, Thinking und Ergebnisse auf-/zuklappen">Technische Details</button>
    <button class="chip" id="chip-only" title="Nur Nachrichten mit Kommentaren oder Links zeigen">Nur kommentierte</button>
    <button class="chip" id="chip-raw" title="Rohdaten je Nachricht anzeigen">Rohdaten</button>
    <button class="icon-btn" id="btn-smaller" title="Schrift kleiner">A−</button>
    <button class="icon-btn" id="btn-bigger" title="Schrift größer">A+</button>
    <button class="icon-btn" id="btn-theme" title="Hell/Dunkel"></button>
    <button class="icon-btn" id="btn-export" title="Chat als Bundle exportieren (inkl. Kommentare, Links, Dateien)"></button>
    <button class="icon-btn" id="btn-side" title="Seitenleiste ein-/ausblenden"></button>
  </header>

  <div class="layout" id="layout">
    <aside class="pane library" id="library"></aside>
    <main class="pane chat" id="chat"></main>
    <aside class="pane sidebar" id="sidebar"></aside>
  </div>

  <dialog id="dlg-sessions">
    <h2>Claude-Code-Session öffnen</h2>
    <div class="list" id="session-list"></div>
    <div class="form"><div class="actions"><button class="btn text" data-close>Schließen</button></div></div>
  </dialog>

  <input type="file" id="file-import" accept=".jsonl,.json" hidden>
  <div class="dropzone" id="drop">Datei hier ablegen zum Importieren</div>
  <script src="app.js"></script>
</body>
</html>
